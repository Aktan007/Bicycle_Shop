{% extends 'shop/base.html' %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0"><i class="bi bi-shield-lock"></i> Вход в систему</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="login" class="form-label fw-semibold">
                            <i class="bi bi-person"></i> Логин
                        </label>
                        <input type="text" class="form-control form-control-lg" id="login" name="login" placeholder="Введите логин" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">
                            <i class="bi bi-key"></i> Пароль
                        </label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Введите пароль" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                        <i class="bi bi-box-arrow-in-right"></i> Войти
                    </button>
                </form>
                <hr>
                <a href="{% url 'shop:products_list' %}" class="btn btn-outline-secondary w-100">
                    <i class="bi bi-eye"></i> Продолжить как гость
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
